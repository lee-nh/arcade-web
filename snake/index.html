<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>클래식 스네이크 게임 (Snake Game)</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <!-- 헤더 및 점수판 -->
        <header class="game-header">
            <h1 class="game-title">🐍 SNAKE</h1>
            <div class="scoreboard">
                <div class="score-card">
                    <span class="label">SCORE</span>
                    <span id="current-score" class="value">0</span>
                </div>
                <div class="score-card">
                    <span class="label">BEST</span>
                    <span id="best-score" class="value">0</span>
                </div>
            </div>
        </header>

        <!-- 캔버스 및 오버레이 영역 -->
        <div class="canvas-wrapper">
            <canvas id="game-canvas" width="400" height="400"></canvas>
            
            <!-- 시작 및 게임오버 오버레이 -->
            <div id="overlay" class="overlay">
                <div class="overlay-content">
                    <h2 id="overlay-title">SNAKE GAME</h2>
                    <p id="overlay-msg">방향키 또는 시작 버튼을 눌러 플레이하세요!</p>
                    <div id="final-stats" class="final-stats hidden">
                        <p>최종 점수: <span id="final-score">0</span></p>
                    </div>
                    <button id="start-btn" class="btn primary-btn">게임 시작</button>
                </div>
            </div>

            <!-- 일시정지 오버레이 -->
            <div id="pause-overlay" class="overlay hidden">
                <div class="overlay-content">
                    <h2>일시 정지</h2>
                    <p>스페이스바(Space) 또는 계속하기를 누르세요</p>
                    <button id="resume-btn" class="btn primary-btn">계속하기</button>
                </div>
            </div>
        </div>

        <!-- 컨트롤 바 (옵션 버튼들) -->
        <div class="control-panel">
            <div class="difficulty-select">
                <label for="speed-select">난이도:</label>
                <select id="speed-select">
                    <option value="120">쉬움 (느림)</option>
                    <option value="90" selected>보통</option>
                    <option value="65">어려움 (빠름)</option>
                </select>
            </div>
            <div class="toggle-buttons">
                <button id="pause-btn" class="btn icon-btn" title="일시정지 (Space)">⏸️</button>
                <button id="sound-btn" class="btn icon-btn" title="사운드 켜기/끄기">🔊</button>
            </div>
        </div>

        <!-- 모바일 / 터치용 가상 D-패드 -->
        <div class="dpad-container">
            <button class="dpad-btn up" data-dir="ArrowUp" aria-label="위">▲</button>
            <div class="dpad-middle">
                <button class="dpad-btn left" data-dir="ArrowLeft" aria-label="왼쪽">◀</button>
                <button class="dpad-btn down" data-dir="ArrowDown" aria-label="아래">▼</button>
                <button class="dpad-btn right" data-dir="ArrowRight" aria-label="오른쪽">▶</button>
            </div>
        </div>

        <!-- 게임 가이드 -->
        <footer class="game-footer">
            <p><strong>조작법:</strong> 키보드 방향키 또는 <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> | 일시정지: <kbd>Space</kbd></p>
        </footer>
    </div>

    <script src="game.js"></script>
</body>
</html>
