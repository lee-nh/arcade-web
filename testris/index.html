<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>클래식 테트리스 (Tetris)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <header class="game-header">
      <h1>TETRIS</h1>
      <div class="audio-controls">
        <button id="sound-btn" class="icon-btn" title="사운드 켜기/끄기">🔊</button>
      </div>
    </header>

    <div class="main-layout">
      <!-- 왼쪽 사이드바: 홀드 & 통계 -->
      <aside class="sidebar side-left">
        <div class="panel">
          <h2>HOLD</h2>
          <canvas id="hold-canvas" width="100" height="100"></canvas>
          <div class="key-hint">(C 또는 Shift)</div>
        </div>

        <div class="panel stats-panel">
          <div class="stat-item">
            <span class="stat-label">SCORE</span>
            <span id="score" class="stat-value">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">HIGH SCORE</span>
            <span id="high-score" class="stat-value">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">LEVEL</span>
            <span id="level" class="stat-value">1</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">LINES</span>
            <span id="lines" class="stat-value">0</span>
          </div>
        </div>
      </aside>

      <!-- 중앙: 테트리스 메인 보드 -->
      <main class="board-wrapper">
        <div class="canvas-container">
          <canvas id="tetris-canvas" width="300" height="600"></canvas>

          <!-- 오버레이 화면들 (시작, 일시정지, 게임오버) -->
          <div id="start-overlay" class="overlay active">
            <h2>TETRIS</h2>
            <p>스페이스바 또는 시작 버튼을 눌러주세요</p>
            <button id="start-btn" class="primary-btn">게임 시작</button>
          </div>

          <div id="pause-overlay" class="overlay">
            <h2>PAUSED</h2>
            <p>일시 정지되었습니다</p>
            <button id="resume-btn" class="primary-btn">계속하기</button>
          </div>

          <div id="game-over-overlay" class="overlay">
            <h2>GAME OVER</h2>
            <div class="final-score-box">
              <span>최종 점수</span>
              <span id="final-score">0</span>
            </div>
            <button id="restart-btn" class="primary-btn">다시 하기</button>
          </div>
        </div>
      </main>

      <!-- 오른쪽 사이드바: 다음 블록 & 조작법 -->
      <aside class="sidebar side-right">
        <div class="panel">
          <h2>NEXT</h2>
          <canvas id="next-canvas" width="100" height="100"></canvas>
        </div>

        <div class="panel guide-panel">
          <h2>조작법</h2>
          <ul class="controls-list">
            <li><kbd>←</kbd> <kbd>→</kbd> : 좌/우 이동</li>
            <li><kbd>↑</kbd> : 시계방향 회전</li>
            <li><kbd>Z</kbd> : 반시계방향 회전</li>
            <li><kbd>↓</kbd> : 소프트 드롭</li>
            <li><kbd>Space</kbd> : 하드 드롭</li>
            <li><kbd>C</kbd> / <kbd>Shift</kbd> : 홀드</li>
            <li><kbd>P</kbd> / <kbd>Esc</kbd> : 일시 정지</li>
          </ul>
        </div>
      </aside>
    </div>

    <!-- 모바일 / 터치 지원 컨트롤러 -->
    <div class="touch-controls">
      <div class="touch-row">
        <button id="btn-hold" class="touch-btn">HOLD</button>
        <button id="btn-rotate-ccw" class="touch-btn">↶</button>
        <button id="btn-rotate" class="touch-btn">↷</button>
        <button id="btn-hard-drop" class="touch-btn primary">⤓</button>
      </div>
      <div class="touch-row">
        <button id="btn-left" class="touch-btn">◀</button>
        <button id="btn-down" class="touch-btn">▼</button>
        <button id="btn-right" class="touch-btn">▶</button>
      </div>
    </div>
  </div>

  <script src="tetris.js"></script>
</body>
</html>
